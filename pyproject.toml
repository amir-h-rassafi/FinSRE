[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsre"
version = "0.1.0"
description = "Cloud cost optimization and cost incident investigation CLI agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gcp = [
    "google-auth>=2.29,<3",
    "requests>=2.31,<3",
]
llm = [
    "langgraph>=0.2,<1",
    "openai>=1.0,<2",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
finsre = "finsre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
